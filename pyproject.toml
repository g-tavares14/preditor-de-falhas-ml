[project]
name = "preditor-de-falhas-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyspark>=3.5,<3.6",
    "scikit-learn>=1.4",
    "xgboost>=3.2.0",
]

[project.scripts]
preditor = "preditor.__main__:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "preditor"
module-root = "src"

[dependency-groups]
notebook = [
    "ipykernel>=7.3.0",
    "pandas>=3.0.6",
    "requests>=2.34.2",
]
