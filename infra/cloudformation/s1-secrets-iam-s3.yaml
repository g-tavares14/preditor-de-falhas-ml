AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Preditor de Falhas ML S1.4+S1.5+S1.5b+S1.7 — Secrets Manager (RIPE Atlas key),
  Lambda execution role, private S3 raw/curated, team read group, collector
  function, and EventBridge 15 min (default DISABLED). Secret value is never
  in Git.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    arch: Lambda(S1.7)->Secret+S3 write; humans->IAM group read-only (S1.5b)
    must:
      - never put Atlas API key in template, params, or Git
      - bucket BlockPublicAccess all-on; TLS-only bucket policy
      - role Principal=lambda.amazonaws.com + SourceAccount/SourceArn
      - team group identity policy only (IAM groups cannot be S3 policy principals)
    ref:
      - docs/aws_secrets_iam.md
      - docs/aws_s3.md
      - docs/acesso_s3_time.md
      - docs/aws_lambda.md
    owner: Grupo 16 / g-tavares14/preditor-de-falhas-ml

Parameters:
  BucketName:
    Type: String
    Default: preditor-falhas-ml
    AllowedPattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
    ConstraintDescription: Valid S3 bucket name (globally unique, lowercase).
    Description: Canonical bucket (S1.5). Change only if the name is already taken.

  SecretName:
    Type: String
    Default: RIPE_ATLAS_API_KEY
    AllowedPattern: ^[A-Za-z0-9/_+=.@-]+$
    Description: Canonical Secrets Manager name (S1.4).

  LambdaFunctionName:
    Type: String
    Default: preditor-falhas-collector
    AllowedPattern: ^[a-zA-Z0-9-_]{1,64}$
    Description: >-
      Reserved Lambda name for S1.7. Used to scope the role trust SourceArn
      and CloudWatch Logs ARNs. Function must keep this name.

  AtlasMeasurementIds:
    Type: String
    Default: ""
    Description: >-
      Comma-separated live msm_id for env RIPE_ATLAS_MSM_IDS. Empty until
      createPeriodic produces new IDs. Manual invoke may pass msm_ids in
      the event payload.

  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: >-
      EventBridge kill-switch. Keep DISABLED until createPeriodic IDs are
      set and a manual invoke has written raw+curated.

  CollectorPackageKey:
    Type: String
    Default: artifacts/lambda/preditor-falhas-collector.zip
    Description: S3 key of the collector zip (uploaded by infra/aws/package.sh).

  CollectWindowSeconds:
    Type: Number
    Default: 1200
    MinValue: 60
    MaxValue: 86400
    Description: Fixed GET window in seconds (20 min overlap on a 15 min rate).

Resources:
  RipeAtlasApiKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Holds RIPE Atlas API key off-repo; GenerateSecretString is a
          placeholder until `aws secretsmanager put-secret-value`. Rejected
          SSM here to keep one GetSecretValue path for Lambda.
        must:
          - Name stays RIPE_ATLAS_API_KEY unless hub Notion is updated
          - never echo SecretString in logs/PR
        mutable: change-with-constraints
        mutability:
          Name: must-never-change
    Properties:
      Name: !Ref SecretName
      Description: RIPE Atlas API key for preditor-de-falhas-ml (set via CLI)
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: preditor-de-falhas-ml
        - Key: Sprint
          Value: "1"
        - Key: Card
          Value: S1.4

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Project "database": Atlas JSONL (raw) + disciplina CSV (curated).
          GP bucket + SSE-S3; x Intelligent-Tiering (tiny objects, monitoring
          fee can exceed storage). Versioning on to protect curated overwrite.
        must:
          - BlockPublicAccess all four true
          - SSE-S3 AES256
          - writers = Lambda role only; humans read via group preditor-dados-leitura
        mutable: change-with-constraints
        mutability:
          BucketName: must-never-change
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-mpu
            Status: Enabled
            Prefix: ""
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: preditor-de-falhas-ml
        - Key: Sprint
          Value: "1"
        - Key: Card
          Value: S1.5

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Execution role for S1.7 collector. Created now so S3 bucket policy
          can bind to a stable ARN. Fn itself is out of scope.
        must:
          - trust lambda.amazonaws.com + SourceAccount + SourceArn of reserved fn
          - GetSecretValue only this secret; S3 Get/Put only raw/* and curated/*
          - logs only /aws/lambda/<LambdaFunctionName>
        mutable: change-with-constraints
        mutability:
          AssumeRolePolicyDocument: review-required
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowLambdaAssumeThisAccount
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunctionName}
      Description: Preditor de Falhas ML Lambda collector (S1.4; function in S1.7)
      Policies:
        - PolicyName: preditor-falhas-lambda-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadRipeAtlasSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Ref RipeAtlasApiKey
              - Sid: WriteRawAndCurated
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${BucketName}/raw/*
                  - !Sub arn:${AWS::Partition}:s3:::${BucketName}/curated/*
              - Sid: CreateCollectorLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${LambdaFunctionName}
              - Sid: WriteCollectorLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${LambdaFunctionName}:*
      Tags:
        - Key: Project
          Value: preditor-de-falhas-ml
        - Key: Sprint
          Value: "1"
        - Key: Card
          Value: S1.4

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Align bucket policy with S1.4 role + deny non-TLS. Team read is
          identity-based on IAM group (groups cannot be S3 principals).
        must:
          - Deny aws:SecureTransport=false
          - Allow Get/Put only for LambdaExecutionRole on raw/* and curated/*
          - do not put IAM group as Principal here
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub ${DataBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: LambdaWriteRawCurated
            Effect: Allow
            Principal:
              AWS: !GetAtt LambdaExecutionRole.Arn
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource:
              - !Sub ${DataBucket.Arn}/raw/*
              - !Sub ${DataBucket.Arn}/curated/*

  TeamReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          S1.5b humans List+Get raw/curated. Spec from Notion card. x Put,
          x secret, x ListAllMyBuckets.
        must:
          - no s3:PutObject/DeleteObject/GetSecretValue
          - ListBucket only prefixes raw and curated
        mutable: change-with-constraints
    Properties:
      ManagedPolicyName: preditor-dados-leitura
      Description: Read-only S3 raw and curated for Grupo 16 (S1.5b)
      Path: /
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ListBucketPreditor
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !GetAtt DataBucket.Arn
            Condition:
              StringLike:
                s3:prefix:
                  - raw/*
                  - curated/*
                  - raw
                  - curated
          - Sid: ReadObjectsPreditor
            Effect: Allow
            Action:
              - s3:GetObject
            Resource:
              - !Sub ${DataBucket.Arn}/raw/*
              - !Sub ${DataBucket.Arn}/curated/*

  TeamReadGroup:
    Type: AWS::IAM::Group
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Canonical group preditor-dados-leitura. Users added out-of-band
          (add-team-user.sh); x Lambda role for reading data.
        must:
          - GroupName stays preditor-dados-leitura
          - attach TeamReadPolicy only
        mutable: change-with-constraints
        mutability:
          GroupName: must-never-change
    Properties:
      GroupName: preditor-dados-leitura
      ManagedPolicyArns:
        - !Ref TeamReadPolicy

  CollectorFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          S1.7 GET collector. Imports package fetch_measurement_results +
          curated_row. Zip uploaded to artifacts/ (not raw/curated).
        must:
          - FunctionName stays preditor-falhas-collector
          - Runtime python3.12; Timeout 60
          - no Atlas API key in Environment
          - no POST / create_periodic / get_data in the handler
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Description: Preditor de Falhas ML GET collector (S1.7). No POST.
      Runtime: python3.12
      Architectures:
        - x86_64
      Handler: preditor_de_falhas_ml.handler.lambda_handler
      Timeout: 60
      MemorySize: 512
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref DataBucket
          RIPE_ATLAS_MSM_IDS: !Ref AtlasMeasurementIds
          SECRET_NAME: !Ref SecretName
          COLLECT_WINDOW_SECONDS: !Sub "${CollectWindowSeconds}"
      Code:
        S3Bucket: !Ref DataBucket
        S3Key: !Ref CollectorPackageKey
      Tags:
        - Key: Project
          Value: preditor-de-falhas-ml
        - Key: Sprint
          Value: "1"
        - Key: Card
          Value: S1.7

  CollectorSchedule:
    Type: AWS::Events::Rule
    Metadata:
      com.aws.cloudformation.Context:
        why: 15 min GET cadence. Kill-switch is State=DISABLED or disable-rule.
        must:
          - default DISABLED until live msm_ids exist
          - never POST on the schedule
    Properties:
      Name: preditor-falhas-collector-15min
      Description: >-
        S1.7 GET collector every 15 min. Kill-switch:
        aws events disable-rule --name preditor-falhas-collector-15min
        --region sa-east-1
      ScheduleExpression: rate(15 minutes)
      State: !Ref ScheduleState
      Targets:
        - Id: CollectorLambda
          Arn: !GetAtt CollectorFunction.Arn

  CollectorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CollectorSchedule.Arn

Outputs:
  Region:
    Description: Region where this stack was deployed (register in docs/PR)
    Value: !Ref AWS::Region
  BucketName:
    Description: S3 bucket for Atlas raw JSONL and curated CSV
    Value: !Ref DataBucket
    Export:
      Name: !Sub ${AWS::StackName}-BucketName
  BucketArn:
    Description: ARN of the project S3 bucket
    Value: !GetAtt DataBucket.Arn
  SecretName:
    Description: Secrets Manager secret name (canonical RIPE_ATLAS_API_KEY)
    Value: !Ref SecretName
  SecretArn:
    Description: ARN of the RIPE Atlas API key secret
    Value: !Ref RipeAtlasApiKey
  LambdaRoleArn:
    Description: Execution role ARN for the S1.7 Lambda
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LambdaRoleArn
  LambdaFunctionName:
    Description: Collector function name (must stay preditor-falhas-collector)
    Value: !Ref LambdaFunctionName
  CollectorFunctionArn:
    Description: ARN of preditor-falhas-collector
    Value: !GetAtt CollectorFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-CollectorFunctionArn
  CollectorScheduleName:
    Description: EventBridge rule (kill-switch = disable this rule)
    Value: !Ref CollectorSchedule
  CollectorScheduleState:
    Description: ENABLED or DISABLED (default DISABLED)
    Value: !Ref ScheduleState
  S3BucketEnv:
    Description: Lambda env S3_BUCKET
    Value: !Ref DataBucket
  AtlasMeasurementIdsEnv:
    Description: Lambda env RIPE_ATLAS_MSM_IDS (live createPeriodic IDs)
    Value: !Ref AtlasMeasurementIds
  TeamReadGroupName:
    Description: IAM group for S1.5b team read-only (add IAM users here)
    Value: !Ref TeamReadGroup
  TeamReadPolicyArn:
    Description: Managed policy ARN attached to preditor-dados-leitura
    Value: !Ref TeamReadPolicy
