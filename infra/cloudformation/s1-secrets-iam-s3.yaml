AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Preditor de Falhas ML S1.4+S1.5 — Secrets Manager (RIPE Atlas key),
  Lambda execution role (least privilege), and private S3 raw/curated.
  Secret value is never in Git; set via CLI after deploy.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    arch: Lambda(S1.7)->Secret+S3; this stack = secret, role, bucket (x Lambda fn)
    must:
      - never put Atlas API key in template, params, or Git
      - bucket BlockPublicAccess all-on; TLS-only bucket policy
      - role Principal=lambda.amazonaws.com + SourceAccount/SourceArn
    ref:
      - docs/aws_secrets_iam.md
      - docs/aws_s3.md
    owner: Grupo 16 / g-tavares14/preditor-de-falhas-ml

Parameters:
  BucketName:
    Type: String
    Default: preditor-falhas-ml
    AllowedPattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
    ConstraintDescription: Valid S3 bucket name (globally unique, lowercase).
    Description: Canonical bucket (S1.5). Change only if the name is already taken.

  SecretName:
    Type: String
    Default: RIPE_ATLAS_API_KEY
    AllowedPattern: ^[A-Za-z0-9/_+=.@-]+$
    Description: Canonical Secrets Manager name (S1.4).

  LambdaFunctionName:
    Type: String
    Default: preditor-falhas-collector
    AllowedPattern: ^[a-zA-Z0-9-_]{1,64}$
    Description: >-
      Reserved Lambda name for S1.7. Used to scope the role trust SourceArn
      and CloudWatch Logs ARNs. S1.7 must create the function with this name.

Resources:
  RipeAtlasApiKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Holds RIPE Atlas API key off-repo; GenerateSecretString is a
          placeholder until `aws secretsmanager put-secret-value`. Rejected
          SSM here to keep one GetSecretValue path for Lambda.
        must:
          - Name stays RIPE_ATLAS_API_KEY unless hub Notion is updated
          - never echo SecretString in logs/PR
        mutable: change-with-constraints
        mutability:
          Name: must-never-change
    Properties:
      Name: !Ref SecretName
      Description: RIPE Atlas API key for preditor-de-falhas-ml (set via CLI)
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: preditor-de-falhas-ml
        - Key: Sprint
          Value: "1"
        - Key: Card
          Value: S1.4

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Project "database": Atlas JSONL (raw) + disciplina CSV (curated).
          GP bucket + SSE-S3; x Intelligent-Tiering (tiny objects, monitoring
          fee can exceed storage). Versioning on to protect curated overwrite.
        must:
          - BlockPublicAccess all four true
          - SSE-S3 AES256
          - writers = Lambda role only (S1.5b is read-only group later)
        mutable: change-with-constraints
        mutability:
          BucketName: must-never-change
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-mpu
            Status: Enabled
            Prefix: ""
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: preditor-de-falhas-ml
        - Key: Sprint
          Value: "1"
        - Key: Card
          Value: S1.5

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Execution role for S1.7 collector. Created now so S3 bucket policy
          can bind to a stable ARN. Fn itself is out of scope.
        must:
          - trust lambda.amazonaws.com + SourceAccount + SourceArn of reserved fn
          - GetSecretValue only this secret; S3 Get/Put only raw/* and curated/*
          - logs only /aws/lambda/<LambdaFunctionName>
        mutable: change-with-constraints
        mutability:
          AssumeRolePolicyDocument: review-required
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowLambdaAssumeThisAccount
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunctionName}
      Description: Preditor de Falhas ML Lambda collector (S1.4; function in S1.7)
      Policies:
        - PolicyName: preditor-falhas-lambda-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadRipeAtlasSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Ref RipeAtlasApiKey
              - Sid: WriteRawAndCurated
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${BucketName}/raw/*
                  - !Sub arn:${AWS::Partition}:s3:::${BucketName}/curated/*
              - Sid: CreateCollectorLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${LambdaFunctionName}
              - Sid: WriteCollectorLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${LambdaFunctionName}:*
      Tags:
        - Key: Project
          Value: preditor-de-falhas-ml
        - Key: Sprint
          Value: "1"
        - Key: Card
          Value: S1.4

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Align bucket policy with S1.4 role + deny non-TLS (CFN S3 default).
        must:
          - Deny aws:SecureTransport=false
          - Allow Get/Put only for LambdaExecutionRole on raw/* and curated/*
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub ${DataBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: LambdaWriteRawCurated
            Effect: Allow
            Principal:
              AWS: !GetAtt LambdaExecutionRole.Arn
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource:
              - !Sub ${DataBucket.Arn}/raw/*
              - !Sub ${DataBucket.Arn}/curated/*

Outputs:
  Region:
    Description: Region where this stack was deployed (register in docs/PR)
    Value: !Ref AWS::Region
  BucketName:
    Description: S3 bucket for Atlas raw JSONL and curated CSV
    Value: !Ref DataBucket
    Export:
      Name: !Sub ${AWS::StackName}-BucketName
  BucketArn:
    Description: ARN of the project S3 bucket
    Value: !GetAtt DataBucket.Arn
  SecretName:
    Description: Secrets Manager secret name (canonical RIPE_ATLAS_API_KEY)
    Value: !Ref SecretName
  SecretArn:
    Description: ARN of the RIPE Atlas API key secret
    Value: !Ref RipeAtlasApiKey
  LambdaRoleArn:
    Description: Execution role ARN for the S1.7 Lambda
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LambdaRoleArn
  LambdaFunctionName:
    Description: Reserved function name S1.7 must use (trust + logs scope)
    Value: !Ref LambdaFunctionName
  S3BucketEnv:
    Description: Planned Lambda env S3_BUCKET (apply in S1.7)
    Value: !Ref DataBucket
  AtlasMeasurementIdsEnv:
    Description: Planned Lambda env ATLAS_MSM_IDS (fill in S1.6 / apply in S1.7)
    Value: "SET_AFTER_S1.6"
